name: Test invalid semver fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          input_string: 'not-a-version'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MAJOR: ${{ steps.action.outputs.major }}
        run: |
          echo "outcome: $OUTCOME major: $MAJOR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid semver"
            exit 1
          fi
          if [ -n "$MAJOR" ]; then
            echo "FAIL: no outputs expected"
            exit 1
          fi
          echo "PASS"
